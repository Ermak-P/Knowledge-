name: Recover historical P3 native diagnostics
on:
  push:
    branches: [p3]
    paths: ['.github/workflows/p3-native-diagnostics.yml']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This failed native run uploaded artifacts but its Git transport failed.
      # Retain it under its original commit: never attach its result to new code.
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43731796002
          name: p3-Windows-03b6822278c147807bdace816ff95b1aa5dd4e8d
          path: .local/recovered-native
      - name: Retain original failed run without qualifying current source
        env:
          P3_CI_PLATFORM: Windows
        run: python scripts/p3_ci_receipt.py --recovered-root .local/recovered-native --recovered-commit 03b6822278c147807bdace816ff95b1aa5dd4e8d
