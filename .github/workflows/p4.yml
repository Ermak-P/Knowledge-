name: P4 installed verification
on:
  push:
    branches: [p4]
    paths-ignore: ['reports/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux installed tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/setup_p3.py
          .venv/bin/python scripts/verify_p4.py
      - name: Native Windows installed tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python scripts/setup_p3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe scripts/verify_p4.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-${{ matrix.os }}
          path: reports/P4/
