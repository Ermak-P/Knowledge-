name: Knowledge release package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag (knowledge- prefix); build the selected revision'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible kit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^knowledge-[A-Za-z0-9._-]+$ ]] || exit 1
          python -m pip install -r requirements-dev.lock
          python scripts/build_p4.py --output dist/release --source-id "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/release/*.zip
            dist/release/*.sha256
      - name: Create new draft Release (never replace an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/*.zip dist/release/*.sha256 --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Source kit for review; consult exact-source validation receipts and Actions artifacts.'
