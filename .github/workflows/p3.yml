name: P3 release candidate
on:
  push:
    branches: [p3]
    paths-ignore: ['reports/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Linux release verification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/setup_p3.py
          .venv/bin/python -B scripts/setup_benchmark.py
          .venv/bin/python -B scripts/verify_p3.py
      - name: Native Windows PowerShell 5.1 release verification
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & scripts/verify-windows.ps1
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-${{ runner.os }}-${{ github.sha }}
          path: reports/P3/
          if-no-files-found: warn
      - name: Retain branch-scoped CI evidence for Git-only clients
        if: always()
        shell: bash
        env:
          P3_CI_PLATFORM: ${{ runner.os }}
        run: |
          python scripts/p3_ci_receipt.py
