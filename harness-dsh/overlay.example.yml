# Copy outside the repository; use a disposable native DSH profile first.
# Replace the plugin paths and workspace. Use native tools for qualification.
- insert:
    # Optional verbose trajectory observer: add an entry pointing to src/index.ts.
    - id: harness-dsh-engineering
      name: 'C:/LLM/Plugins/Harness-DSH/src/engineering.ts'
      config:
        workspace: 'C:/Temp/DSH-Smoke'
        maxAttempts: 3
        fingerprintBudgetMs: 5000
        fingerprintMetrics: false
        checkTimeoutMs: 300000
        presets:
          planning: standard
          coding: standard
          testing: standard
          verification: standard
          reviewing: standard
        # Reviewed Knowledge read tools; the MCP server must be connected separately.
        # Capability discovery is also allowed by the guard when this list is empty.
        readOnlyTools:
          - mcp__knowledge__knowledge_capabilities
          - mcp__knowledge__knowledge_context
          - mcp__knowledge__knowledge_get_claim
          - mcp__knowledge__knowledge_get_evidence
          - mcp__knowledge__knowledge_instructions
    # Optional live handoff graph in DSH Desktop/Web. Reload the app after enabling.
    - id: harness-dsh-handoffs
      name: 'C:/LLM/Plugins/Harness-DSH/src/handoffs.ts'
