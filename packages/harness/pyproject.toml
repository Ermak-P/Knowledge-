[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-p0"
version = "0.4.0rc2"
requires-python = ">=3.12,<3.13"
dependencies = ["knowledge-p0==0.4.0rc2"]
description = "Controlled Harness execution with a compatible read-only context facade"

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
harness = "harness.cli:main"
harness-run = "harness.run_cli:main"
harness-host = "harness.companion:main"
harness-host-mcp = "harness.host_mcp:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
