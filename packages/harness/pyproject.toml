[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-p0"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["knowledge-p0==0.1.0"]
description = "Controlled Harness execution with a compatible read-only context facade"

[project.scripts]
harness = "harness.cli:main"
harness-run = "harness.run_cli:main"
