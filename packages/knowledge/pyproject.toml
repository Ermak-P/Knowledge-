[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-p0"
version = "0.4.0rc2"
requires-python = ">=3.12,<3.13"
description = "Project-local evidence-backed Knowledge"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
knowledge = "knowledge.cli:main"
knowledge-mcp = "knowledge.mcp:main"
knowledge-maintain = "knowledge.maintain_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
knowledge = ["schemas/*.json"]
